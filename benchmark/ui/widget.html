<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker Widget</title>
    <!-- นำเข้า Font Awesome สำหรับ Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- นำเข้า Font จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #2B2D38;
            --text-light: #FFFFFF;
            --text-muted: #8A8C98;
            --accent-yellow: #FFC107;
            --accent-orange: #FF5722;
            --accent-red: #D32F2F;
            --bar-bg: #1A1B22;
            --divider: #44475A;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #F0F2F5;
            font-family: 'Inter', sans-serif;
        }

        /* กล่องหลักของ Widget */
        .widget {
            position: relative;
            width: 320px;
            height: 320px;
            background: linear-gradient(145deg, #323544, #242631);
            border-radius: 35px;
            padding: 30px;
            box-sizing: border-box;
            color: var(--text-light);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 0 0 6px #F8F9FA;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* กราฟิกพื้นหลัง (วงกลม และคนเดิน) */
        .bg-circle {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background-color: #21232C;
            border-radius: 50%;
            z-index: 1;
        }

        .bg-fan {
            position: absolute;
            bottom: -30px;
            left: 50%;
            margin-left: -110px; /* กึ่งกลางของ 220px */
            font-size: 220px;
            color: rgba(26, 27, 34, 0.4); /* สีทึบๆ จางๆ */
            z-index: 1;
            animation: spin 2s linear infinite;
            transform-origin: center center;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* คอนเทนต์ด้านหน้า (ให้ลอยอยู่เหนือกราฟิกพื้นหลัง) */
        .content-wrapper {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ส่วนหัว (Header) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .activity {
            color: var(--text-light);
        }

        .dots {
            letter-spacing: 2px;
            font-size: 16px;
            cursor: pointer;
        }

        /* ส่วนตัวเลขก้าว (Main Stats) */
        .main-stats {
            margin-top: 15px;
        }

        .steps-number {
            font-size: 54px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .steps-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* ส่วนหลอดความคืบหน้า (Progress Bar) */
        .progress-section {
            margin-top: auto;
            margin-bottom: 20px;
        }

        .progress-text {
            text-align: right;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: var(--bar-bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            cursor: pointer; /* เพิ่ม cursor ให้ดูรู้ว่ากดได้ */
        }

        .progress-fill {
            width: 71%;
            height: 100%;
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            border-radius: 10px 0 0 10px;
        }

        .progress-thumb {
            width: 6px;
            height: 26px;
            background-color: #FFF;
            border-radius: 4px;
            margin-left: -3px; /* ดึงให้มาอยู่กึ่งกลางรอยต่อ */
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            cursor: grab; /* เปลี่ยนเมาส์ให้เป็นรูปมือตอนชี้ */
        }

        .progress-thumb:active {
            cursor: grabbing; /* ตอนกดลากให้เป็นรูปมือกำ */
        }

        /* ส่วนสถิติด้านล่าง (Bottom Stats) */
        .bottom-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .stat-item i {
            font-size: 14px;
            color: var(--text-muted);
        }

        .stat-item.middle {
            border-left: 1px solid var(--divider);
            border-right: 1px solid var(--divider);
        }

        .stat-data {
            display: flex;
            flex-direction: column;
        }

        .stat-val {
            font-size: 14px;
            font-weight: 700;
        }

        .stat-unit {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="widget">
        <!-- กราฟิกพื้นหลัง -->
        <div class="bg-circle"></div>
        <i class="fa-solid fa-fan bg-fan"></i>

        <!-- คอนเทนต์หลัก -->
        <div class="content-wrapper">
            
            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <span class="activity">CPU FAN</span>
                    <span>|</span>
                    <span id="mode-text">MANUAL</span>
                </div>
                <div class="dots">•••</div>
            </div>

            <!-- Main Stats -->
            <div class="main-stats">
                <div class="steps-number" id="rpm-value">2,485</div>
                <div class="steps-label">RPM</div>
            </div>

            <!-- Spacer เพื่อดันส่วนล่างลงไป -->
            <div style="flex-grow: 1;"></div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-text" id="fan-speed-text">71% SPEED</div>
                <div class="progress-bar-container">
                    <div class="progress-fill"></div>
                    <div class="progress-thumb"></div>
                </div>
            </div>

            <!-- Bottom Stats -->
            <div class="bottom-stats">
                <div class="stat-item">
                    <i class="fa-solid fa-temperature-half"></i>
                    <div class="stat-data">
                        <span class="stat-val">65</span>
                        <span class="stat-unit">°C</span>
                    </div>
                </div>
                
                <div class="stat-item middle">
                    <i class="fa-solid fa-microchip"></i>
                    <div class="stat-data">
                        <span class="stat-val">82</span>
                        <span class="stat-unit">% LOAD</span>
                    </div>
                </div>

                <div class="stat-item">
                    <i class="fa-solid fa-bolt"></i>
                    <div class="stat-data">
                        <span class="stat-val">45</span>
                        <span class="stat-unit">WATTS</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

<script>
    // เพิ่มสคริปต์ให้หลอด Progress Bar สามารถลากและอัปเดตค่าได้
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.querySelector('.progress-bar-container');
        const fill = document.querySelector('.progress-fill');
        const text = document.getElementById('fan-speed-text');
        const rpmValue = document.getElementById('rpm-value');
        const fanIcon = document.querySelector('.bg-fan');
        
        let isDragging = false;
        const maxRPM = 3500; // จำลองความเร็วพัดลมสูงสุดที่ 3500 RPM

        // ฟังก์ชันคำนวณและอัปเดตแถบ
        const updateProgress = (clientX) => {
            const rect = container.getBoundingClientRect();
            // หาตำแหน่ง X เทียบกับกล่อง
            let x = clientX - rect.left;
            
            // จำกัดให้อยู่ในขอบเขต 0 ถึงความกว้างสูงสุดของกล่อง
            x = Math.max(0, Math.min(x, rect.width));
            
            // คำนวณเป็นเปอร์เซ็นต์
            const percentage = Math.round((x / rect.width) * 100);
            
            // อัปเดต UI (ความกว้างแถบสี และ ข้อความ)
            fill.style.width = `${percentage}%`;
            text.textContent = `${percentage}% SPEED`;

            // อัปเดตค่า RPM บนหน้าจอ
            const currentRPM = Math.round((maxRPM * percentage) / 100);
            rpmValue.textContent = currentRPM.toLocaleString();

            // เอฟเฟกต์ควบคุมความเร็วการหมุนของพัดลมพื้นหลัง
            if (percentage === 0) {
                fanIcon.style.animationPlayState = 'paused'; // หยุดหมุน
            } else {
                fanIcon.style.animationPlayState = 'running';
                // 100% หมุนไว (0.2s ต่อรอบ), 1% หมุนช้า (4s ต่อรอบ)
                const duration = 4 - (percentage / 100) * 3.8; 
                fanIcon.style.animationDuration = `${duration}s`;
            }
        };

        const onDragStart = (e) => {
            isDragging = true;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            updateProgress(clientX);
            document.body.style.userSelect = 'none'; // ป้องกันการคลุมดำข้อความโดยไม่ได้ตั้งใจขณะลาก
        };

        const onDragMove = (e) => {
            if (!isDragging) return;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            updateProgress(clientX);
        };

        const onDragEnd = () => {
            isDragging = false;
            document.body.style.userSelect = ''; // คืนค่าการเลือกข้อความกลับมา
        };

        // Event สำหรับเมาส์ (Mouse)
        container.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);
        // เผื่อกรณีลากเมาส์ออกนอกหน้าจอแล้วปล่อย
        document.addEventListener('mouseleave', onDragEnd);

        // Event สำหรับมือถือทัชสกรีน (Touch)
        container.addEventListener('touchstart', (e) => {
            onDragStart(e);
        }, { passive: true });
        document.addEventListener('touchmove', onDragMove, { passive: true });
        document.addEventListener('touchend', onDragEnd);
    });
</script>
</body>
</html>
